<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitcom Quote Finder & Visualizer</title>
    
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Premium Vibrant Purple & Minimalist Stylesheet -->
    <style>
        :root {
            --bg-primary: #F9FAFB;
            --bg-card: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
            
            /* Vibrant Purple Theme Accent Colors */
            --accent-purple: #6366F1;
            --accent-purple-hover: #4F46E5;
            --accent-purple-light: #EEF2FF;
            
            /* Shadow Systems */
            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.02);
            --shadow-hover: 0 16px 40px rgba(99, 102, 241, 0.08);
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Sitcom Pastel Badge Themes */
            --color-friends-bg: #FEF3C7;
            --color-friends-txt: #B45309;
            --color-himym-bg: #DBEAFE;
            --color-himym-txt: #1D4ED8;
            --color-b99-bg: #F1F5F9;
            --color-b99-txt: #334155;
            --color-gilmore-bg: #FCE7F3;
            --color-gilmore-txt: #BE185D;
            --color-newgirl-bg: #CCFBF1;
            --color-newgirl-txt: #0F766E;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.5;
            padding: 3rem 1.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        main {
            width: 100%;
            max-width: 1050px;
        }

        /* 1. Header Layout */
        header {
            text-align: center;
            margin-bottom: 3.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        header h1 {
            font-size: 3.25rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            color: var(--text-main);
        }

        header p {
            font-size: 1.15rem;
            color: var(--text-muted);
            font-weight: 300;
            max-width: 620px;
        }

        /* 2. Unified Search Component */
        .search-area {
            width: 100%;
            max-width: 720px;
            margin: 0 auto 3rem auto;
            display: flex;
            flex-direction: column;
        }

        .search-bar-unified {
            display: flex;
            align-items: center;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 9999px;
            padding: 0.4rem 0.5rem 0.4rem 1.5rem;
            box-shadow: var(--shadow-soft);
            transition: var(--transition-smooth);
            width: 100%;
        }

        .search-bar-unified:focus-within {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .search-bar-unified input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 1.1rem;
            color: var(--text-main);
            padding: 0.55rem 0;
            font-family: inherit;
        }

        .search-bar-unified input::placeholder {
            color: #9CA3AF;
        }

        .search-bar-unified button[type="submit"] {
            background-color: var(--accent-purple);
            color: #FFFFFF;
            border: none;
            border-radius: 9999px;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-family: inherit;
            margin-left: 0.5rem;
        }

        .search-bar-unified button[type="submit"]:hover {
            background-color: var(--accent-purple-hover);
        }

        .unified-clear-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.6rem 1.25rem;
            border-radius: 9999px;
            transition: var(--transition-smooth);
            display: none;
            font-family: inherit;
        }

        .unified-clear-btn:hover {
            color: var(--text-main);
            background-color: #F3F4F6;
        }

        /* Try searching row */
        .suggestions-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.1rem;
            font-size: 0.88rem;
            color: var(--text-muted);
            flex-wrap: wrap;
        }

        .suggestion-tag {
            background-color: #E5E7EB;
            color: var(--text-main);
            padding: 0.25rem 0.85rem;
            border-radius: 9999px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition-smooth);
            border: 1px solid transparent;
        }

        .suggestion-tag:hover {
            background-color: var(--accent-purple-light);
            color: var(--accent-purple);
            border-color: rgba(99, 102, 241, 0.25);
        }

        /* Options layout */
        .options-wrapper {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1.5rem;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .option-item select {
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.35rem 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--bg-card);
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .option-item select:hover {
            border-color: var(--accent-purple);
        }

        /* 3. Performance Telemetry HUD */
        .hud-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #F3F4F6;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 0.85rem 1.5rem;
            margin-bottom: 2.5rem;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .hud-left {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .hud-source-badge {
            display: inline-block;
            padding: 0.3rem 0.75rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .badge-cache {
            background-color: #D1FAE5;
            color: #065F46;
            border: 1px solid #A7F3D0;
        }

        .badge-cengine {
            background-color: #FEE2E2;
            color: #991B1B;
            border: 1px solid #FCA5A5;
        }

        /* 4. Strict Sitcom Filter Pills */
        .pills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 3rem;
            justify-content: center;
        }

        .pill-btn {
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            padding: 0.65rem 1.5rem;
            border: 1px solid var(--border-color);
            background-color: #F3F4F6;
            color: var(--text-main);
            border-radius: 9999px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .pill-btn:hover {
            border-color: var(--accent-purple);
            background-color: var(--bg-card);
            color: var(--accent-purple);
        }

        .pill-btn.active {
            background-color: var(--accent-purple);
            color: #FFFFFF;
            border-color: var(--accent-purple);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.25);
        }

        /* 5. Responsive Grid & Quote Cards */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.75rem;
            margin-bottom: 5rem;
        }

        .quote-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.75rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1.25rem;
            box-shadow: var(--shadow-soft);
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .quote-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent-purple);
        }

        /* Card Header Pill Badge */
        .card-sitcom-tag {
            align-self: flex-start;
            padding: 0.25rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.76rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* Pastel Badge Colors mapping */
        .quote-card.friends .card-sitcom-tag { background-color: var(--color-friends-bg); color: var(--color-friends-txt); }
        .quote-card.himym .card-sitcom-tag { background-color: var(--color-himym-bg); color: var(--color-himym-txt); }
        .quote-card.b99 .card-sitcom-tag { background-color: var(--color-b99-bg); color: var(--color-b99-txt); }
        .quote-card.gilmore .card-sitcom-tag { background-color: var(--color-gilmore-bg); color: var(--color-gilmore-txt); }
        .quote-card.newgirl .card-sitcom-tag { background-color: var(--color-newgirl-bg); color: var(--color-newgirl-txt); }

        .card-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.45;
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }

        .card-meta {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .card-characters {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .card-characters span {
            color: var(--text-muted);
            font-weight: 400;
        }

        .card-episode-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-context {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
            border-left: 2px solid var(--border-color);
            padding-left: 0.75rem;
            margin-top: 0.4rem;
        }

        .card-action {
            border-top: 1px solid var(--border-color);
            padding-top: 1.1rem;
            margin-top: auto;
            display: flex;
            justify-content: flex-end;
        }

        .visualize-btn {
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 0.55rem 1.1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }

        .visualize-btn:hover {
            border-color: var(--accent-purple);
            background-color: var(--accent-purple);
            color: #FFFFFF;
        }

        /* 6. Empty State */
        .empty-state {
            text-align: center;
            padding: 5rem 2rem;
            font-size: 1.15rem;
            color: var(--text-muted);
            border: 1.5px dashed var(--border-color);
            border-radius: 20px;
            background-color: var(--bg-card);
            width: 100%;
        }

        /* Responsive Layout Updates */
        @media(max-width: 640px) {
            header h1 { font-size: 2.35rem; }
            .search-bar-unified { flex-direction: column; border-radius: 24px; padding: 1rem; gap: 0.75rem; }
            .search-bar-unified input { text-align: center; width: 100%; }
            .search-bar-unified button[type="submit"] { width: 100%; margin-left: 0; }
            .unified-clear-btn { width: 100%; text-align: center; }
            .options-wrapper { flex-direction: column; gap: 0.75rem; align-items: center; }
            .hud-panel { flex-direction: column; gap: 0.5rem; text-align: center; }
        }
    </style>
</head>
<body>

<main>
    <!-- Header -->
    <header>
        <h1>Sitcom Quote Finder</h1>
        <p>A beautifully styled, high-performance web app powered by a dynamic C-based Levenshtein fuzzy engine and custom O(1) LRU Caching.</p>
    </header>

    <!-- Search Section -->
    <div class="search-area">
        <form id="searchForm" onsubmit="event.preventDefault(); triggerSearch();">
            <div class="search-bar-unified">
                <input type="text" id="searchInput" placeholder="Type a typo-heavy query (e.g. 'we wr on a brak', 'lobstr', 'yogrt')..." autocomplete="off" oninput="toggleClearButton()">
                <button type="button" id="clearBtn" class="unified-clear-btn" onclick="clearSearch()">Clear</button>
                <button type="submit">Search</button>
            </div>
        </form>

        <!-- Suggestions row -->
        <div class="suggestions-row">
            <span>Try searching:</span>
            <span class="suggestion-tag" onclick="clickSuggestion('legengerry')">legengerry</span>
            <span class="suggestion-tag" onclick="clickSuggestion('break')">break</span>
            <span class="suggestion-tag" onclick="clickSuggestion('cookie')">cookie</span>
            <span class="suggestion-tag" onclick="clickSuggestion('lobster')">lobster</span>
        </div>

        <!-- Options row -->
        <div class="options-wrapper">
            <div class="option-item">
                <label for="sortCriteria">Sort Criteria</label>
                <select id="sortCriteria" onchange="triggerSearch()">
                    <option value="CHRONOLOGICAL">Chronologically (Sitcom, Season)</option>
                    <option value="SPEAKER">Alphabetically by Speaker Name</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Performance timing telemetry HUD -->
    <div class="hud-panel">
        <div class="hud-left" id="hudStats">
            <span>Ready to explore sitcom quotes...</span>
        </div>
        <div id="hudBadgeContainer">
            <!-- Rendered dynamically -->
        </div>
    </div>

    <!-- Strict Sitcom Filter Pills -->
    <div class="pills-container">
        <button class="pill-btn active" onclick="setSitcomFilter('ALL', this)">All Shows</button>
        <button class="pill-btn" onclick="setSitcomFilter('Friends', this)">Friends</button>
        <button class="pill-btn" onclick="setSitcomFilter('How I Met Your Mother', this)">How I Met Your Mother</button>
        <button class="pill-btn" onclick="setSitcomFilter('Brooklyn Nine-Nine', this)">Brooklyn Nine-Nine</button>
        <button class="pill-btn" onclick="setSitcomFilter('Gilmore Girls', this)">Gilmore Girls</button>
        <button class="pill-btn" onclick="setSitcomFilter('New Girl', this)">New Girl</button>
    </div>

    <!-- Clean Cards Grid -->
    <div class="cards-grid" id="cardsGrid">
        <!-- Rendered dynamically via JS -->
    </div>
</main>

<!-- JS Controller Logic -->
<script>
    let masterQuotes = [];
    let filteredQuotes = [];
    let currentSitcomFilter = 'ALL';

    // 1. Initial Page Load
    window.addEventListener('DOMContentLoaded', () => {
        fetchAllQuotes();
    });

    // Fetch all quotes initially
    async function fetchAllQuotes() {
        try {
            const res = await fetch('/api/quotes');
            const data = await res.json();
            if (data.status === 'success') {
                masterQuotes = data.quotes;
                applyFilterAndRender();
                updateHUD("Loaded balanced database successfully", 0, "c_engine", data.count);
            }
        } catch (err) {
            console.error("Error loading master database:", err);
            document.getElementById('cardsGrid').innerHTML = `
                <div class="empty-state">
                    Failed to connect. Please verify if the Flask server is running inside WSL.
                </div>
            `;
        }
    }

    // 2. Fuzzy Search & Sort API Dispatcher
    async function triggerSearch() {
        const query = document.getElementById('searchInput').value;
        const sortCriteria = document.getElementById('sortCriteria').value;

        try {
            const res = await fetch(`/api/search?q=${encodeURIComponent(query)}&sort_type=${sortCriteria}`);
            const data = await res.json();
            
            if (data.status === 'success') {
                masterQuotes = data.quotes;
                applyFilterAndRender();
                
                // Update Timing HUD with Adaptive Sorting stats
                updateHUD(
                    `Fuzzy search results for "${query || 'all'}"`,
                    data.time_ms,
                    data.source,
                    data.count,
                    data.algo_name,
                    data.algo_reason
                );
                toggleClearButton();
            }
        } catch (err) {
            console.error("Error executing fuzzy search:", err);
        }
    }

    // 3. Suggestion Tags Click Handler
    function clickSuggestion(text) {
        const input = document.getElementById('searchInput');
        input.value = text;
        toggleClearButton();
        triggerSearch();
    }

    // Toggle visibility of the Clear button dynamically
    function toggleClearButton() {
        const query = document.getElementById('searchInput').value;
        const clearBtn = document.getElementById('clearBtn');
        if (query.trim().length > 0) {
            clearBtn.style.display = 'inline-block';
        } else {
            clearBtn.style.display = 'none';
        }
    }

    // Clear search keyword and restore full dataset while preserving the active sitcom filter
    function clearSearch() {
        document.getElementById('searchInput').value = '';
        toggleClearButton();
        fetchAllQuotes();
    }

    // 4. Pill Filter Click Handler
    function setSitcomFilter(sitcomName, element) {
        // Toggle Active pill selection styles
        document.querySelectorAll('.pill-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');

        // Apply dynamically filtered view in-memory instantly
        currentSitcomFilter = sitcomName;
        applyFilterAndRender();
    }

    // 5. Client-side Interactive Filter & Rendering Logic
    function applyFilterAndRender() {
        if (currentSitcomFilter === 'ALL') {
            filteredQuotes = masterQuotes;
        } else {
            filteredQuotes = masterQuotes.filter(q => q.sitcom.toLowerCase() === currentSitcomFilter.toLowerCase());
        }

        renderCards();
    }

    // Render Cards in Grid
    function renderCards() {
        const grid = document.getElementById('cardsGrid');
        grid.innerHTML = '';

        if (filteredQuotes.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    No matching quotes found inside the database. Adjust your search parameters!
                </div>
            `;
            return;
        }

        filteredQuotes.forEach(q => {
            // Map sitcom name to CSS class
            let showClass = '';
            if (q.sitcom.includes('Friends')) showClass = 'friends';
            else if (q.sitcom.includes('Mother')) showClass = 'himym';
            else if (q.sitcom.includes('Nine-Nine')) showClass = 'b99';
            else if (q.sitcom.includes('Gilmore')) showClass = 'gilmore';
            else if (q.sitcom.includes('Girl')) showClass = 'newgirl';

            const card = document.createElement('div');
            card.className = `quote-card ${showClass}`;
            card.innerHTML = `
                <span class="card-sitcom-tag">${q.sitcom}</span>
                <div class="card-text">"${q.text}"</div>
                
                <div class="card-meta">
                    <div class="card-characters">${q.speaker} <span>to</span> ${q.spoken_to}</div>
                    <div class="card-episode-info">Season ${q.season}, Episode ${q.episode}</div>
                    ${q.context ? `<div class="card-context">${q.context}</div>` : ''}
                </div>
                
                <div class="card-action">
                    <button class="visualize-btn" onclick="visualizeScene('${q.sitcom}', '${q.speaker}', '${q.text.replace(/'/g, "\\'")}')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        View Scene
                    </button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // 6. Dynamic Performance Timing HUD Updater
    function updateHUD(message, timeMs, source, count, algoName, algoReason) {
        const statsEl = document.getElementById('hudStats');
        const badgeContainer = document.getElementById('hudBadgeContainer');

        if (timeMs === 0) {
            statsEl.innerHTML = `<span>${message} (${count} quotes total)</span>`;
            badgeContainer.innerHTML = '';
            return;
        }

        let algoText = "";
        if (algoName && algoName !== "None") {
            algoText = `<span>&bull;</span> <span>Adaptive C-Sort: <strong style="color: var(--accent-purple);">${algoReason}</strong></span>`;
        }

        statsEl.innerHTML = `
            <span><strong>${count}</strong> matches found</span>
            <span>&bull;</span>
            <span>Completed in <strong>${timeMs.toFixed(3)} ms</strong></span>
            ${algoText}
        `;

        if (source === 'cache') {
            badgeContainer.innerHTML = `<span class="hud-source-badge badge-cache">LRU Cache Hit</span>`;
        } else {
            badgeContainer.innerHTML = `<span class="hud-source-badge badge-cengine">C Levenshtein Engine</span>`;
        }
    }

    // 7. YouTube Scene Visualizer Pop-up Launcher
    function visualizeScene(sitcom, speaker, quoteText) {
        // Construct highly targeted search query
        // Format: "SitcomName SpeakerName scene QuoteSubstring"
        const cleanQuote = quoteText.split(' ').slice(0, 5).join(' '); // take first 5 words for cleaner query
        const query = `${sitcom} ${speaker} scene ${cleanQuote}`;
        const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
        
        // Open search in a sleek, isolated window/tab
        window.open(searchUrl, '_blank');
    }
</script>
</body>
</html>
